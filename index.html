<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linkpayvip</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(160deg,#061426,#0b2945);
  color:white;
}

.container{
  width:100%;
  max-width:430px;
  margin:auto;
  padding:25px 18px;
}

.logo{
  text-align:center;
  padding:25px 0;
}

.logo img{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
}

.logo h1{
  margin:12px 0 5px;
  font-size:30px;
}

.logo p{
  color:#aebdca;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
  padding:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h2{
  text-align:center;
  margin-top:0;
}

.input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:0;
  border-radius:10px;
  outline:none;
  font-size:16px;
}

.btn{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:#1599e5;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.green{
  background:#20b85a;
}

.link{
  text-align:center;
  color:#55c9ff;
  margin-top:18px;
  cursor:pointer;
}

.remember{
  margin:12px 0;
  font-size:14px;
}

.agree{
  font-size:13px;
  color:#c5ced7;
  margin:12px 0;
}

.hidden{
  display:none;
}

.message{
  text-align:center;
  margin-top:12px;
  color:#7ee787;
}

.photo-box{
  text-align:center;
  margin:10px 0;
}

.photo-preview{
  width:80px;
  height:80px;
  border-radius:50%;
  object-fit:cover;
  display:none;
  margin:10px auto;
}

.footer{
  text-align:center;
  color:#8796a8;
  font-size:12px;
  margin:22px 0;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGO -->
  <div class="logo">

    <!-- अपनी फोटो/Logo बाद में यहाँ बदल सकते हैं -->
    <img
  id="mainLogo"
  src="Link%20pay%20vip.png"
  alt="Linkpayvip">

    <h1>Linkpayvip</h1>
    <p>Welcome back</p>

  </div>


  <!-- LOGIN PAGE -->
  <div class="card" id="loginPage">

    <h2>Sign In</h2>

    <input
      class="input"
      type="tel"
      id="loginPhone"
      placeholder="Phone"
    >

    <input
      class="input"
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <input
      class="input"
      type="password"
      id="loginPin"
      maxlength="6"
      placeholder="6-digit PIN"
    >

    <div class="remember">
      <input type="checkbox" id="remember">
      Remember Me
    </div>

    <div class="agree">
      <input type="checkbox" id="privacy">
      I agree to the Privacy Agreement
    </div>

    <button class="btn" onclick="demoLogin()">
      Sign In
    </button>

    <div class="link" onclick="showRegister()">
      Create New Account
    </div>

    <div class="link">
      Forgot Password
    </div>

    <div class="message" id="loginMessage"></div>

  </div>


  <!-- REGISTER PAGE -->
  <div class="card hidden" id="registerPage">

    <h2>Create Account</h2>

    <!-- PHOTO UPLOAD -->
    <div class="photo-box">

      <img
        id="photoPreview"
        class="photo-preview"
        alt="Preview">

      <input
        type="file"
        id="photo"
        accept="image/*"
        onchange="previewPhoto()">

    </div>

    <input
      class="input"
      id="username"
      type="text"
      placeholder="Username">

    <input
      class="input"
      id="registerPassword"
      type="password"
      placeholder="Password">

    <input
      class="input"
      id="registerPhone"
      type="tel"
      placeholder="Phone">

    <input
      class="input"
      id="otp"
      type="text"
      maxlength="6"
      placeholder="Demo OTP">

    <input
      class="input"
      id="invite"
      type="text"
      placeholder="Invite Code">

    <button class="btn green" onclick="demoRegister()">
      Sign Up
    </button>

    <div class="link" onclick="showLogin()">
      Already have an account? Login
    </div>

    <div class="message" id="registerMessage"></div>

  </div>

  <div class="footer">
    Linkpayvip • Demo Version 1.0
  </div>

</div>


<script>

function showRegister(){

  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("registerPage")
    .classList.remove("hidden");
}


function showLogin(){

  document.getElementById("registerPage")
    .classList.add("hidden");

  document.getElementById("loginPage")
    .classList.remove("hidden");
}


function demoLogin(){

  const privacy =
    document.getElementById("privacy").checked;

  const message =
    document.getElementById("loginMessage");

  if(!privacy){

    message.innerText =
      "Please accept the Privacy Agreement.";

    return;
  }

  message.innerText =
    "Demo login successful.";
}


function demoRegister(){

  const username =
    document.getElementById("username").value;

  const phone =
    document.getElementById("registerPhone").value;

  const otp =
    document.getElementById("otp").value;

  const message =
    document.getElementById("registerMessage");

  if(!username || !phone){

    message.innerText =
      "Please fill the required fields.";

    return;
  }

  if(otp !== "123456"){

    message.innerText =
      "Demo OTP के लिए 123456 डालें.";

    return;
  }

  message.innerText =
    "Demo account created successfully.";
}


function previewPhoto(){

  const file =
    document.getElementById("photo").files[0];

  const preview =
    document.getElementById("photoPreview");

  if(file){

    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      "block";
  }
}

</script>

</body>
</html>
