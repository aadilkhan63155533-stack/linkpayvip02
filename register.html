<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Linkpay VIP - Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <img class="brand-logo" src="logo.png" alt="Linkpay VIP">
  <div class="tabs">
    <a class="tab" href="index.html">Sign In</a>
    <button class="tab active">Register</button>
  </div>

  <div class="field"><span>👤</span><input type="text" placeholder="User Name"></div>
  <div class="field"><span>🔒</span><input type="password" placeholder="Password"></div>
  <div class="field"><span>📱</span><input type="tel" placeholder="+91 Phone" inputmode="numeric"></div>
  <div class="field"><span>✉️</span><input id="otp" type="text" maxlength="6" placeholder="OTP Code" inputmode="numeric"></div>
  <div class="field"><span>🔗</span><input type="text" placeholder="Invite Code"></div>

  <button class="main-btn" id="send">Send OTP</button>
  <div class="timer-row"><span id="status"></span><b id="timer"></b></div>
  <button class="main-btn" id="signup">Sign Up</button>
  <p id="message" class="message"></p>
</div>

<script>
let timerId;
function runTimer(){
  let s=60;
  const t=document.getElementById("timer");
  clearInterval(timerId);
  t.textContent="01:00";
  timerId=setInterval(()=>{
    s--;
    t.textContent=`00:${String(s).padStart(2,"0")}`;
    if(s<=0){clearInterval(timerId);t.textContent="00:00";}
  },1000);
}
document.getElementById("send").onclick=()=>{
  document.getElementById("status").textContent="OTP requested";
  runTimer();
};
document.getElementById("signup").onclick=()=>{
  const otp=document.getElementById("otp").value.trim();
  document.getElementById("message").textContent=otp ? "Invalid OTP." : "Please enter OTP Code.";
};
</script>
</body>
</html>
